name: Build and Test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - '.github/workflows/build-and-test.yml'
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - '.github/workflows/build-and-test.yml'

permissions: {}

jobs:
  terraform-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: frasermolyneux/actions/terraform-setup@594500f81ee7fdb65616bba793f8cdf9025d57b2 # terraform-setup/v1.1.0
        with:
          terraform-folder: terraform
          terraform-version: "1.17.0"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform init -lockfile=readonly -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Validate the complete repository analysis catalog without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/repository-analysis.tftest.hcl

      - name: Validate cost budget policies without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/cost-budgets.tftest.hcl

      - name: Validate collector identity lookup with mocked providers
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/idp-cost-reader.tftest.hcl

      - name: Validate baremetal Cloudflare credential contracts without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/cloudflare-credentials.tftest.hcl

      - name: Validate runtime GitHub App declarations without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/runtime-github-apps.tftest.hcl

      - name: Validate Actions runner enrollments without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/actions-runners.tftest.hcl

      - name: Validate workload Terraform storage containers with mocked providers
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/workload-terraform-storage.tftest.hcl

      - name: Test runtime GitHub App bootstrap
        run: |
          python3 -m pip install --requirement scripts/requirements-github-apps.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
