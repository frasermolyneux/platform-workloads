name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - '.github/workflows/build-and-test.yml'

permissions: {}

jobs:
  terraform-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: frasermolyneux/actions/terraform-setup@terraform-setup/v1.0.0
        with:
          terraform-folder: terraform

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform init -lockfile=readonly -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Validate the complete repository analysis catalog without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/repository-analysis.tftest.hcl

      - name: Validate runtime GitHub App declarations without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/runtime-github-apps.tftest.hcl

      - name: Validate Actions runner enrollments without provider reads
        run: terraform -chdir=terraform test -var-file=tfvars/prd.tfvars -filter=tests/actions-runners.tftest.hcl

      - name: Test runtime GitHub App bootstrap
        run: |
          python3 -m pip install --requirement scripts/requirements-github-apps.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
