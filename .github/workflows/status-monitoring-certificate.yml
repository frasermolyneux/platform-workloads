name: Rotate Status Monitoring Reader Certificate

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"
  workflow_run:
    workflows: ["Deploy Prd"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: status-monitoring-reader-certificate
  cancel-in-progress: false

jobs:
  rotate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Register, verify and publish only the dedicated reader certificate
        run: python3 scripts/rotate_status_monitoring_certificate.py
