# This workflow is used during feature development, it will perform lightweight CI.

name: Feature Development

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/*'

permissions: {}

jobs:
  terraform-plan-prd:
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    environment: Production
    runs-on: ubuntu-latest

    concurrency: # This is required to prevent multiple GitHub Actions invocations against stateful resources. e.g. Terraform state file / Database / Deployed Apps
      group: ${{ github.repository }}-prd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: frasermolyneux/actions/terraform-setup@594500f81ee7fdb65616bba793f8cdf9025d57b2 # terraform-setup/v1.1.0
        id: toolchain
        with:
          terraform-folder: terraform
          terraform-version: "1.17.0"
          terraform_wrapper: "false"
      - name: Validate the private Production plan without applying
        id: guard
        run: python3 scripts/guard_idp_cutover.py --plan-only
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          TF_IN_AUTOMATION: "true"
          GITHUB_TOKEN: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      - name: Publish attempted plan execution metadata
        if: always() && steps.guard.outputs.plan_outcome != ''
        uses: frasermolyneux/actions/terraform-receipt@027d7e31bb32b734090aaed01b36d74f1d658b61
        with:
          context-directory: ${{ steps.toolchain.outputs.directory }}
          operation: plan
          outcome: ${{ steps.guard.outputs.plan_outcome }}
          environment: prd
