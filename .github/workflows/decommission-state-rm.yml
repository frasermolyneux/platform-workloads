name: Decommission State Rm

on:
  workflow_dispatch:
    inputs:
      workload-name:
        description: "The workload name to detach from Terraform state (e.g. portal-sync)"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.repository }}-prd

jobs:
  terraform-state-rm-prd:
    permissions:
      contents: read
      id-token: write
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: frasermolyneux/actions/terraform-state-rm@027d7e31bb32b734090aaed01b36d74f1d658b61 # terraform-state-rm/v3.0.0
        with:
          terraform-folder: "terraform"
          terraform-version: "1.17.0"
          terraform-var-file: "tfvars/prd.tfvars"
          terraform-backend-file: "backends/prd.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          state-addresses: ${{ format('[{0}]', toJSON(format('github_repository.workload["{0}"]', inputs.workload-name))) }}
        env:
          GITHUB_TOKEN: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
